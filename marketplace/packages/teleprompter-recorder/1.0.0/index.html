<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>口播提词器</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0d12; color: #f6f7fb; }
    body.call-mode { background: transparent; overflow: hidden; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; padding: 24px; background: radial-gradient(circle at top, rgba(102,116,255,.25), transparent 42%), #0b0d12; }
    body.call-mode .app { display: none; }
    .hero { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }
    .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #aab2d9; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 54px); line-height: 1.02; }
    .lead { color: #c8cce0; line-height: 1.7; max-width: 68ch; }
    .card { border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(255,255,255,.06); padding: 18px; backdrop-filter: blur(20px); }
    textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(0,0,0,.26); color: inherit; padding: 14px 16px; line-height: 1.7; outline: none; }
    textarea:focus { border-color: rgba(151,164,255,.7); }
    .hint { margin: 10px 0 0; color: #9ba3c7; font-size: 13px; }
    .call-ui { display: none; position: fixed; inset: 0; pointer-events: none; color: white; }
    body.call-mode .call-ui { display: block; }
    .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.48), transparent 22%, transparent 68%, rgba(0,0,0,.64)); pointer-events: none; }
    .topbar { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: auto; }
    .badge { padding: 8px 12px; border-radius: 999px; background: rgba(12,14,20,.62); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(16px); font-size: 13px; }
    .close { width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(10,12,18,.7); color: #fff; font-size: 24px; }
    .prompter-wrap { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); width: min(88vw, 980px); height: 48%; overflow: hidden; pointer-events: none; mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); }
    .prompter { height: 100%; overflow: hidden; padding: 30% 4% 34%; text-align: center; font-size: 40px; line-height: 1.55; font-weight: 700; letter-spacing: .01em; text-shadow: 0 2px 14px rgba(0,0,0,.88); white-space: pre-wrap; }
    .editor-panel { position: absolute; left: 18px; bottom: max(18px, env(safe-area-inset-bottom)); width: min(420px, calc(100vw - 36px)); max-height: 38vh; padding: 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 16px; background: rgba(9,11,17,.72); backdrop-filter: blur(22px); pointer-events: auto; }
    .editor-panel textarea { min-height: 84px; max-height: 18vh; resize: vertical; padding: 9px 10px; font-size: 13px; }
    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 9px; }
    .sliders label { display: grid; gap: 5px; color: #d8dced; font-size: 11px; }
    .sliders input { width: 100%; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .actions button { border: 1px solid rgba(255,255,255,.16); color: #fff; background: rgba(255,255,255,.10); border-radius: 12px; padding: 9px 12px; }
    .actions button.primary { background: #fff; color: #101116; border-color: #fff; font-weight: 700; }
    .actions button.recording { background: #ef4154; border-color: #ef4154; color: #fff; }
    .status { margin-top: 8px; min-height: 18px; color: #cdd2ea; font-size: 12px; }
    @media (max-width: 680px) { .prompter-wrap { top: 9%; height: 46%; } .prompter { font-size: 32px; } .editor-panel { width: calc(100vw - 28px); left: 14px; bottom: 14px; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="hero">
      <span class="eyebrow">Fabushi Mini App</span>
      <h1>口播提词器</h1>
      <p class="lead">在这个 Mini App 所属 Bot 里点击“视频通话”，Fabushi 会打开摄像头和麦克风；本 Mini App 负责提词器界面、滚动与录制控制。结束录制后，视频会通过 Fabushi 媒体层自动回到同一个 Bot 会话。</p>
      <section class="card">
        <strong>默认口播稿</strong>
        <textarea id="standaloneScript" placeholder="把准备口播的文案粘贴到这里……"></textarea>
        <p class="hint">文案会使用 Mini App CloudStorage 保存。进入视频通话后仍可继续修改。</p>
      </section>
    </div>
  </main>

  <section class="call-ui" aria-label="口播视频通话">
    <div class="shade"></div>
    <div class="topbar"><span class="badge" id="callBadge">口播录制 · 准备中</span><button class="close" id="closeCall" type="button" aria-label="结束视频通话">×</button></div>
    <div class="prompter-wrap"><div class="prompter" id="prompter"></div></div>
    <div class="editor-panel">
      <textarea id="callScript" placeholder="粘贴或编辑口播文案……"></textarea>
      <div class="sliders">
        <label>字号 <input id="fontSize" type="range" min="24" max="72" value="40" /></label>
        <label>速度 <input id="scrollSpeed" type="range" min="0" max="140" value="42" /></label>
      </div>
      <div class="actions">
        <button id="toggleScroll" type="button">开始滚动</button>
        <button id="resetScroll" type="button">回到开头</button>
        <button id="record" class="primary" type="button">开始录制</button>
      </div>
      <div class="status" id="status">等待 Fabushi 摄像头与麦克风……</div>
    </div>
  </section>

  <script>
    (() => {
      const APP_ID = 'teleprompter-recorder';
      const PROTOCOL = 'fabushi.miniapp.call.v1';
      const standalone = document.getElementById('standaloneScript');
      const callScript = document.getElementById('callScript');
      const prompter = document.getElementById('prompter');
      const fontSize = document.getElementById('fontSize');
      const scrollSpeed = document.getElementById('scrollSpeed');
      const toggleScroll = document.getElementById('toggleScroll');
      const resetScroll = document.getElementById('resetScroll');
      const record = document.getElementById('record');
      const status = document.getElementById('status');
      const callBadge = document.getElementById('callBadge');
      const closeCall = document.getElementById('closeCall');
      let callId = '';
      let recording = false;
      let scrolling = false;
      let lastFrame = 0;
      let saveTimer = 0;

      function api() { return window.FabushiMiniApp && window.FabushiMiniApp.CloudStorage; }
      async function loadScript() {
        try {
          const stored = await api()?.getItem('script');
          if (stored) standalone.value = callScript.value = stored;
        } catch {}
        renderScript();
      }
      function saveScript(value) {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(() => { void api()?.setItem('script', value).catch(() => {}); }, 250);
      }
      function renderScript() { prompter.textContent = callScript.value || '把口播提示词粘贴到左下方，然后开始滚动。'; }
      function syncScript(value) { standalone.value = callScript.value = value; renderScript(); saveScript(value); }
      standalone.addEventListener('input', () => syncScript(standalone.value));
      callScript.addEventListener('input', () => syncScript(callScript.value));
      fontSize.addEventListener('input', () => { prompter.style.fontSize = `${fontSize.value}px`; });

      function scrollFrame(now) {
        if (!scrolling) return;
        if (!lastFrame) lastFrame = now;
        const delta = Math.max(0, Math.min(80, now - lastFrame));
        lastFrame = now;
        prompter.scrollTop += (Number(scrollSpeed.value) * delta) / 1000;
        if (prompter.scrollTop + prompter.clientHeight >= prompter.scrollHeight - 2) {
          scrolling = false;
          toggleScroll.textContent = '重新滚动';
          return;
        }
        requestAnimationFrame(scrollFrame);
      }
      toggleScroll.addEventListener('click', () => {
        scrolling = !scrolling;
        toggleScroll.textContent = scrolling ? '暂停滚动' : '继续滚动';
        if (scrolling) { lastFrame = 0; requestAnimationFrame(scrollFrame); }
      });
      resetScroll.addEventListener('click', () => { scrolling = false; prompter.scrollTop = 0; toggleScroll.textContent = '开始滚动'; });

      function post(action, payload = {}) {
        window.parent.postMessage({ protocol: PROTOCOL, action, miniAppId: APP_ID, callId, ...payload }, '*');
      }
      record.addEventListener('click', () => {
        if (!callId) return;
        if (!recording) {
          post('record.start');
          status.textContent = '正在请求开始录制……';
        } else {
          post('record.stop');
          status.textContent = '正在结束并保存视频……';
        }
      });
      closeCall.addEventListener('click', () => post('close'));

      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.protocol !== PROTOCOL || data.miniAppId !== APP_ID) return;
        if (data.action === 'call.start') {
          callId = String(data.callId || '');
          document.body.classList.add('call-mode');
          callBadge.textContent = data.kind === 'video' ? '口播录制 · 视频通话' : '口播录制';
          status.textContent = data.mediaReady ? '摄像头和麦克风已就绪' : '正在申请摄像头和麦克风权限……';
          syncScript(callScript.value || standalone.value);
          post('ready');
        }
        if (data.callId && callId && data.callId !== callId) return;
        if (data.action === 'media.ready') status.textContent = '摄像头和麦克风已就绪';
        if (data.action === 'record.started') {
          recording = true;
          record.textContent = '结束录制';
          record.classList.remove('primary');
          record.classList.add('recording');
          callBadge.textContent = '● 正在录制';
          status.textContent = '正在录制，继续对着提词器口播';
        }
        if (data.action === 'record.saved') {
          recording = false;
          record.textContent = '再次录制';
          record.classList.add('primary');
          record.classList.remove('recording');
          callBadge.textContent = '口播录制 · 已保存';
          status.textContent = '视频已保存到当前 Bot 会话，可以结束通话。';
        }
        if (data.action === 'record.error' || data.action === 'media.error') {
          recording = false;
          record.textContent = '重新录制';
          record.classList.add('primary');
          record.classList.remove('recording');
          status.textContent = String(data.error || '媒体操作失败，请检查摄像头/麦克风权限。');
        }
      });

      void loadScript();
    })();
  </script>
</body>
</html>
