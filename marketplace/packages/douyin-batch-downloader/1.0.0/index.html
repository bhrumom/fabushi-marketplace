<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>抖音批量无水印下载</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui;background:linear-gradient(145deg,#111018,#24142b);color:#fff}.shell{max-width:820px;margin:auto;padding:30px 20px}.hero,.panel{border:1px solid #56375f;border-radius:20px;background:#1d1725e8;padding:22px;margin-bottom:16px}h1{margin:0 0 8px;font-size:27px}.muted{color:#c9b6ce}textarea,input{width:100%;border:1px solid #65476e;border-radius:12px;background:#100d15;color:#fff;padding:12px;margin-top:8px}textarea{min-height:190px;resize:vertical}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}button{border:0;border-radius:12px;background:#e84e8a;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#493450}.notice{border-left:3px solid #ffca65;padding-left:12px;color:#f5dab0}pre{white-space:pre-wrap;color:#dbcde0;background:#100d15;padding:12px;border-radius:12px}</style></head><body><main class="shell"><section class="hero"><h1>抖音批量无水印下载</h1><p class="muted">粘贴多条你有权访问的抖音分享链接，本地运行时会限速解析、去重、下载并生成 manifest.json。</p><p class="notice">不会绕过登录、验证码、私密内容或 DRM。请只下载你拥有或获准保存的内容。</p></section><section class="panel"><label>抖音链接（每行一条）<textarea id="urls" placeholder="https://v.douyin.com/...&#10;https://www.douyin.com/video/..."></textarea></label><div class="row"><label>本地目录<input id="output" value="douyin-videos"></label><button id="resolve" class="secondary">先解析</button><button id="download">下载到本地</button></div><pre id="status">等待输入。命令会交给已安装的 Fabushi 本地运行时执行。</pre></section></main><script>(()=>{const q=id=>document.getElementById(id),status=q('status');function run(name){const urls=q('urls').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(!urls.length){status.textContent='请至少输入一条抖音链接。';return}const args={urls,outputDir:q('output').value.trim()||'douyin-videos'};status.textContent=`已请求 ${name} ${urls.length} 条链接；请在 Fabushi 授权卡确认本地网络/文件操作。`;parent.postMessage({type:'fabushi-miniapp-command',miniAppId:'douyin-batch-downloader',command:`/douyin-batch-downloader:${name} ${JSON.stringify(args)}`},'*')}q('resolve').onclick=()=>run('resolve');q('download').onclick=()=>run('download')})()</script></body></html>
